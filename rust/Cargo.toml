[package]
name = "rust_lib_tor"
version = "0.2.1"
authors = ["Igor Cota <igor@foundation.xyz>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
async-trait = "0.1"
futures = "0.3"
lazy_static = "1.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
libc = "0.2"
liblzma = { version = "0.4.9", features = ["static"] }
# TLS to relays is rustls with the aws-lc-rs provider, the backend Arti
# recommends, on every platform: no OpenSSL, no native-tls. Default features
# are off only to leave native-tls out; the rest is Arti's default set, and
# `static-sqlite` bundles SQLite as `static` did.
arti-client = { version = "0.48.0", default-features = false, features = [
    "tokio",
    "rustls",
    "compression",
    "static-sqlite",
    "onion-service-client",
] }
arti = { version = "2.8.0", default-features = false, features = [
    "tokio",
    "rustls-aws-lc-rs",
    "dns-proxy",
    "harden",
    "compression",
    "bridge-client",
    "pt-client",
    "onion-service-client",
    "vanguards",
    "experimental-api",
    "static-sqlite",
] }
tor-rtcompat = { version = "0.48.0", default-features = false, features = ["tokio", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = [
    "std",
    "logging",
    "aws-lc-rs",
] }
tor-config = "0.48.0"
log = "0.4.20"
rlimit = "0.10.1"
anyhow = "1.0.79"
time = "0.3.36"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }

# Panics must unwind, never abort. Arti's tor-circmgr `expect`s the spawn of
# every tunnel-building task, and once a stop has closed the client's tracked
# spawner that spawn is refused, so a stop that races a circuit build panics
# on a Tokio worker. Tokio catches an unwinding panic and the stop completes;
# with `panic = "abort"` every such stop would kill the app. src/lib.rs refuses
# to compile without unwinding, and a test checks these profiles.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
