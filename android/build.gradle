// The Android Gradle Plugin builds the native code with the Android NDK.

group = "com.flutter_rust_bridge.rust_lib_tor"
version = "1.0"

// No buildscript classpath: this plugin is only ever built inside a Flutter
// app, whose settings (or root buildscript) already put the Android Gradle
// Plugin on a parent classloader, and that copy wins. A version pinned here
// would be downloaded on every clean build and then never used.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.flutter_rust_bridge.rust_lib_tor"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version declared by the consuming Flutter application.
    ndkVersion = android.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "rust_lib_tor"
}
